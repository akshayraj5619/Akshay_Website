<!DOCTYPE html>
<html>
<head>
<title>Photos</title>

<style>
body {
    margin: 0;
    font-family: Poppins;
    background: #0f172a;
    color: white;
}

h1 {
    text-align: center;
    padding: 20px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 15px;
    padding: 20px;
}

.gallery img {
    width: 100%;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
}

.gallery img:hover {
    transform: scale(1.05);
}

/* FULLSCREEN VIEW */
.viewer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    display: none;
    justify-content: center;
    align-items: center;
}

.viewer img {
    max-width: 90%;
    max-height: 90%;
}

.back {
    text-align: center;
    display: block;
    margin: 20px;
    color: white;
}
</style>

</head>

<body>

<h1>My Photos 📸</h1>

<a href="index.html" class="back">⬅ Back</a>

<div class="gallery">
    <img src="photo1.JPG">
    <img src="photo2.JPG">
    <img src="photo3.JPG">
    <img src="photo4.JPG">
    <img src="photo5.JPG">
</div>

<div class="viewer" onclick="closeViewer()">
    <img id="fullImage">
</div>

<script>
const images = document.querySelectorAll('.gallery img');
const viewer = document.querySelector('.viewer');
const fullImage = document.getElementById('fullImage');

images.forEach(img => {
    img.addEventListener('click', () => {
        viewer.style.display = 'flex';
        fullImage.src = img.src;
    });
});

function closeViewer() {
    viewer.style.display = 'none';
}
</script>

</body>
</html>
